log_format strangler '$remote_addr - $request '
                     'upstream=$upstream_addr status=$status '
                     'upstream_status=$upstream_status';

upstream django_v1 {
    server django_web:8000;
}

upstream pagos_v2 {
    server pagos_flask:5000;
}

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log strangler;

    location /api/v1/ {
        proxy_pass http://django_v1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v2/pagos/ {
        proxy_pass http://pagos_v2;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://django_v1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
